name: Cloud Video Trimmer

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL to trim'
        required: true
      start:
        description: 'Start timestamp (e.g. 00:01:00 or seconds)'
        required: true
      end:
        description: 'End timestamp (e.g. 00:02:30 or seconds)'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The bot token is a secret, never a dispatch input: dispatch inputs are
      # visible in the Actions UI of this public repo. Add BOT_TOKEN under
      # Settings -> Secrets and variables -> Actions before dispatching.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Trim Video
        run: |
          python trim.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.start }}" "${{ github.event.inputs.end }}" "${{ github.event.inputs.chat_id }}"
