name: TikTok Diag Test
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run TikTok Diag
        run: |
          pip install -q yt-dlp curl-cffi requests
          python diag_tt.py
