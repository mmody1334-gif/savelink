name: Universal Cloud Live Stream Recorder

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Live Stream Target or URL'
        required: true
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record Stream
        run: |
          python recorder.py "${{ github.event.inputs.model }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.bot_token }}"

      - name: Backup Uploader (Always Runs)
        if: always()
        run: |
          python uploader.py "${{ github.event.inputs.model }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.bot_token }}"
