name: HLS Stream Worker

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Stream Target ID'
        required: true
      chat_id:
        description: 'Notification ID'
        required: true
      watch_mode:
        description: 'Wait mode'
        required: false
        default: '0'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The bot token is a secret, never a dispatch input: dispatch inputs are
      # visible in the Actions UI of this public repo. Add BOT_TOKEN under
      # Settings -> Secrets and variables -> Actions before dispatching.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
    steps:
      - name: Mask inputs
        run: |
          CHAT="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          MODEL="$(jq -r '.inputs.model // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$CHAT" ] && echo "::add-mask::$CHAT"
          [ -n "$MODEL" ] && echo "::add-mask::$MODEL"
          CLEAN_ID="$(printf '%s' "$MODEL" | sed -E 's#^https?://[^/]+/##; s#^@##; s#[/?].*$##')"
          [ -n "$CLEAN_ID" ] && echo "::add-mask::$CLEAN_ID"
          for word in chaturbate stripchat tiktok; do
            echo "::add-mask::$word"
          done

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process Stream
        run: |
          CHAT="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          MODEL="$(jq -r '.inputs.model // empty' "$GITHUB_EVENT_PATH")"
          WATCH="$(jq -r '.inputs.watch_mode // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$CHAT" ] && echo "::add-mask::$CHAT"
          [ -n "$MODEL" ] && echo "::add-mask::$MODEL"
          python recorder.py "$MODEL" "$CHAT" "$WATCH"

      - name: Finalize Output
        if: always()
        run: |
          CHAT="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          MODEL="$(jq -r '.inputs.model // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$CHAT" ] && echo "::add-mask::$CHAT"
          [ -n "$MODEL" ] && echo "::add-mask::$MODEL"
          python uploader.py "$MODEL" "$CHAT"
