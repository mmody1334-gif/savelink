name: Universal Cloud Live Stream Recorder

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Live Stream Target or URL'
        required: true
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: true
      watch_mode:
        description: 'Watch mode: wait for stream if offline'
        required: false
        default: '0'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The bot token is a secret, never a dispatch input: dispatch inputs are
      # visible in the Actions UI of this public repo. Add BOT_TOKEN under
      # Settings -> Secrets and variables -> Actions before dispatching.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
    steps:
      - name: Mask chat id
        run: |
          echo "::add-mask::$(jq -r '.inputs.chat_id' "$GITHUB_EVENT_PATH")"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record Stream
        run: |
          MODEL="$(jq -r '.inputs.model // empty' "$GITHUB_EVENT_PATH")"
          CHAT="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          WATCH="$(jq -r '.inputs.watch_mode // empty' "$GITHUB_EVENT_PATH")"
          python recorder.py "$MODEL" "$CHAT" "$WATCH"

      - name: Backup Uploader (Always Runs)
        if: always()
        run: |
          MODEL="$(jq -r '.inputs.model // empty' "$GITHUB_EVENT_PATH")"
          CHAT="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          python uploader.py "$MODEL" "$CHAT"
